[project]
name = "morgenzeitung"
version = "0.1.0"
description = "Comic-Zeitung zum Ausdrucken für den nächsten Schultag – automatisch aus dem Schul-Dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/morgenzeitung/render/fonts/*.txt"]
requires-python = ">=3.12"
keywords = ["schule", "dashboard", "zeitung", "comic", "stundenplan", "hausaufgaben", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: German",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "playwright>=1.48",
]

[project.scripts]
zeitung = "morgenzeitung.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morgenzeitung"]
